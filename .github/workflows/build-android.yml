name: Build Android APK

on:
  # 手动运行
  workflow_dispatch:

  # 推送到 main 分支时运行
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"

  # Pull Request 到 main 分支时运行
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-apk.yml"

# 同一个分支只保留最新构建
concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限
permissions:
  contents: read

jobs:
  build-android:
    name: Build ARM64 Release APK
    runs-on: ubuntu-latest

    # 防止构建无限等待
    timeout-minutes: 45

    env:
      CI: true

      # 减少 Flutter 命令交互和统计上报
      FLUTTER_SUPPRESS_ANALYTICS: true

      # Gradle 网络与内存优化
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.jvmargs=-Xmx3072m
        -Dfile.encoding=UTF-8
        -Dkotlin.incremental=true
        -Djava.net.preferIPv4Stack=true

    steps:
      # ============================================================
      # 1. 检出代码
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ============================================================
      # 2. 清理 GitHub Runner 不需要的软件，释放磁盘空间
      # ============================================================
      - name: Free disk space
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android/sdk/ndk/21.* || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/22.* || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/23.* || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/24.* || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25.* || true

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          echo "Disk space after cleanup:"
          df -h

      # ============================================================
      # 3. 配置 Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 4. 配置 Flutter
      # 与截图中的 Flutter 版本保持一致
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
          cache-key: flutter-3.38.7-stable-${{ runner.os }}-${{ runner.arch }}
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      # ============================================================
      # 5. Flutter 配置
      # ============================================================
      - name
