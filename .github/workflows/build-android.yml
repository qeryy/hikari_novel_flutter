name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      FLUTTER_SUPPRESS_ANALYTICS: true
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.jvmargs=-Xmx3072m
        -Dfile.encoding=UTF-8
        -Dkotlin.incremental=true
        -Djava.net.preferIPv4Stack=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Locate Flutter project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Repository root ====="
          pwd

          echo "===== Repository files ====="
          find . -maxdepth 3 -type f \
            \( -name "pubspec.yaml" -o -name "gradlew" \) \
            -print

          PUBSPEC_PATH=$(find . \
            -maxdepth 4 \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.pub-cache/*" \
            -not -path "*/build/*" \
            | head -n 1)

          if [ -z "$PUBSPEC_PATH" ]; then
            echo "::error::仓库中没有找到 pubspec.yaml。"
            echo "::error::请确认 Flutter 项目文件已经提交到 GitHub。"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          PROJECT_DIR=${PROJECT_DIR#./}

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR=""
          fi

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_PATH="$GITHUB_WORKSPACE"
          else
            PROJECT_PATH="$GITHUB_WORKSPACE/$PROJECT_DIR"
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"

          echo "Flutter project directory: $PROJECT_PATH"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            ${{ steps.locate.outputs.project_path }}/android/**/*.gradle*
            ${{ steps.locate.outputs.project_path }}/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true

      - name: Configure Flutter
        shell: bash
        run: |
          flutter config --no-analytics
          dart --disable-analytics || true
          flutter config --enable-android

      - name: Validate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Project directory ====="
          echo "$PROJECT_PATH"

          echo "===== Project contents ====="
          ls -la "$PROJECT_PATH"

          if [ ! -f "$PROJECT_PATH/pubspec.yaml" ]; then
            echo "::error::未找到 $PROJECT_PATH/pubspec.yaml"
            exit 1
          fi

          if [ ! -d "$PROJECT_PATH/lib" ]; then
            echo "::error::未找到 $PROJECT_PATH/lib"
            exit 1
          fi

          if [ ! -d "$PROJECT_PATH/android" ]; then
            echo "::error::未找到 Android 项目目录：$PROJECT_PATH/android"
            echo "::error::请在本地执行 flutter create --platforms=android . 并提交 android 目录。"
            exit 1
          fi

          if [ ! -f "$PROJECT_PATH/android/gradlew" ]; then
            echo "::error::未找到 Gradle Wrapper：$PROJECT_PATH/android/gradlew"
            echo "::error::请在本地执行 flutter create --platforms=android . 并提交生成的文件。"
            exit 1
          fi

          chmod +x "$PROJECT_PATH/android/gradlew"

      - name: Show environment information
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_path }}
        run: |
          echo "===== Flutter ====="
          flutter --version

          echo "===== Dart ====="
          dart --version

          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          ./android/gradlew --version

          echo "===== Memory ====="
          free -h

          echo "===== Disk ====="
          df -h

      - name: Run Flutter Doctor
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_path }}
        run: flutter doctor -v

      - name: Get Flutter dependencies
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_path }}
        run: |
          set -euo pipefail

          if [ -f "pubspec.lock" ]; then
            flutter pub get --enforce-lockfile
          else
            flutter pub get
          fi

      - name: Build ARM64 Release APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_path }}
        timeout-minutes: 35
        run: |
          set -euo pipefail
          set -o pipefail

          mkdir -p build-logs

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --no-pub \
            --verbose \
            2>&1 | tee build-logs/flutter-build.log

      - name: Verify generated APK
        id: verify
        if: success()
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_path }}
        run: |
          set -euo pipefail          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true

      - name: Configure Flutter
        shell: bash
        run: |
          flutter config --no-analytics
          dart --disable-analytics || true
          flutter config --enable-android

      - name: Show environment information
        shell: bash
        run: |
          echo "===== Flutter ====="
          flutter --version

          echo "===== Dart ====="
          dart --version

          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          chmod +x android/gradlew
          cd android
          ./gradlew --version

          echo "===== Memory ====="
          free -h

          echo "===== Disk space ====="
          df -h

      - name: Run Flutter Doctor
        shell: bash
        run: flutter doctor -v

      - name: Get Flutter dependencies
        shell: bash
        run: |
          if [ -f "pubspec.lock" ]; then
            flutter pub get --enforce-lockfile
          else
            flutter pub get
          fi

      - name: Build ARM64 Release APK
        shell: bash
        timeout-minutes: 35
        run: |
          set -o pipefail

          mkdir -p build-logs

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --no-pub \
            --verbose \
            2>&1 | tee build-logs/flutter-build.log

      - name: Verify generated APK
        id: verify
        if: success()
        shell: bash
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK file was not generated."
            echo "APK files found:"
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

          echo "APK path: $APK_PATH"
          echo "APK size: $APK_SIZE"
          echo "SHA-256: $APK_SHA256"

          ls -lh "$APK_PATH"

      - name: Generate SHA-256 checksum
        if: success()
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-arm64-v8a-release.apk \
            > app-arm64-v8a-release.apk.sha256

          cat app-arm64-v8a-release.apk.sha256

      - name: Write build summary
        if: success()
        shell: bash
        run: |
          {
            echo "# Android APK 构建成功"
            echo ""
            echo "## 构建信息"
            echo ""
            echo "- Flutter：3.38.7 stable"
            echo "- Java：17"
            echo "- 类型：Release"
            echo "- 架构：ARM64 / arm64-v8a"
            echo "- APK 大小：${{ steps.verify.outputs.apk_size }}"
            echo "- SHA-256：\`${{ steps.verify.outputs.apk_sha256 }}\`"
            echo ""
            echo "## 产物"
            echo ""
            echo "- app-arm64-v8a-release.apk"
           
