name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      FLUTTER_SUPPRESS_ANALYTICS: true
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.jvmargs=-Xmx3072m
        -Dfile.encoding=UTF-8
        -Dkotlin.incremental=true
        -Djava.net.preferIPv4Stack=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Locate Flutter project
        id: locate_project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC_PATH=$(find . \
            -maxdepth 5 \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.pub-cache/*" \
            -not -path "*/build/*" \
            | head -n 1)

          if [ -z "$PUBSPEC_PATH" ]; then
            echo "::error::No pubspec.yaml was found in the repository."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          PROJECT_DIR=${PROJECT_DIR#./}

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project directory: $PROJECT_DIR"

          echo "Relevant project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( -name "pubspec.yaml" -o -name "gradlew" -o -name "gradle-wrapper.properties" \) \
            -print || true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            ${{ steps.locate_project.outputs.project_dir }}/android/**/*.gradle*
            ${{ steps.locate_project.outputs.project_dir }}/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true

      - name: Configure Flutter
        shell: bash
        run: |
          flutter config --no-analytics
          dart --disable-analytics || true
          flutter config --enable-android

      - name: Validate Flutter project
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ ! -f "pubspec.yaml" ]; then
            echo "::error::pubspec.yaml does not exist in the detected project directory."
            exit 1
          fi

          if [ ! -d "lib" ]; then
            echo "::error::The lib directory does not exist."
            exit 1
          fi

          if [ ! -d "android" ]; then
            echo "::error::The android directory does not exist. Run: flutter create --platforms=android ."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "::error::android/gradlew does not exist. Run: flutter create --platforms=android ."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Show environment information
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          echo "===== Flutter ====="
          flutter --version

          echo "===== Dart ====="
          dart --version

          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          ./android/gradlew --version

          echo "===== Memory ====="
          free -h

          echo "===== Disk ====="
          df -h

      - name: Run Flutter Doctor
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: flutter doctor -v

      - name: Get Flutter dependencies
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -euo pipefail

          if [ -f "pubspec.lock" ]; then
            flutter pub get --enforce-lockfile
          else
            flutter pub get
          fi

      - name: Build ARM64 Release APK
        id: build_apk
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        timeout-minutes: 35
        run: |
          set -euo pipefail
          mkdir -p build-logs

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --no-pub \
            --verbose \
            2>&1 | tee build-logs/flutter-build.log

      - name: Verify generated APK
        id: verify_apk
        if: success()
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK_PATH="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK was not generated: $APK_PATH"
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')

          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

          cd "$(dirname "$APK_PATH")"
          sha256sum "$(basename "$APK_PATH")" > "$(basename "$APK_PATH").sha256"

          echo "APK size: $APK_SIZE"
          echo "APK SHA-256: $APK_SHA256"

      - name: Write build summary
        if: success()
        shell: bash
        run: |
          {
            echo "# Android APK build completed"
            echo ""
            echo "- Flutter: 3.38.7 stable"
            echo "- Java: 17"
            echo "- Build type: Release"
            echo "- Architecture: ARM64 / arm64-v8a"
            echo "- APK size: ${{ steps.verify_apk.outputs.apk_size }}"
            echo "- SHA-256: ${{ steps.verify_apk.outputs.apk_sha256 }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: android-arm64-release-${{ github.run_number }}
          path: |
            ${{ steps.locate_project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ steps.locate_project.outputs.project_dir }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

      - name: Show failure diagnostics
        if: failure()
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.locate_project.outputs.project_dir }}"
          LOG_FILE="$PROJECT_DIR/build-logs/flutter-build.log"

          if [ -f "$LOG_FILE" ]; then
            echo "===== Last 300 build log lines ====="
            tail -n 300 "$LOG_FILE"
          fi

          echo "===== Relevant repository files ====="
          find . -maxdepth 6 -type f \
            \( -name "pubspec.yaml" -o -name "gradlew" -o -name "*.apk" \) \
            -print || true

          echo "===== Memory ====="
          free -h || true

          echo "===== Disk ====="
          df -h || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-build-diagnostics-${{ github.run_number }}
          path: |
            ${{ steps.locate_project.outputs.project_dir }}/build-logs/
            ${{ steps.locate_project.outputs.project_dir }}/android/app/build/reports/
            ${{ steps.locate_project.outputs.project_dir }}/android/build/reports/
            ${{ steps.locate_project.outputs.project_dir }}/build/app/reports/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
