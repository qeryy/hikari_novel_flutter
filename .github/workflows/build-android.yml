name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "android/**"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-android.yml"

  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-android.yml"

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build ARM64 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      FLUTTER_SUPPRESS_ANALYTICS: true
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.jvmargs=-Xmx3072m
        -Dfile.encoding=UTF-8
        -Dkotlin.incremental=true
        -Djava.net.preferIPv4Stack=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true

      - name: Configure Flutter
        shell: bash
        run: |
          flutter config --no-analytics
          dart --disable-analytics || true
          flutter config --enable-android

      - name: Show environment information
        shell: bash
        run: |
          echo "===== Flutter ====="
          flutter --version

          echo "===== Dart ====="
          dart --version

          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          chmod +x android/gradlew
          cd android
          ./gradlew --version

          echo "===== Memory ====="
          free -h

          echo "===== Disk space ====="
          df -h

      - name: Run Flutter Doctor
        shell: bash
        run: flutter doctor -v

      - name: Get Flutter dependencies
        shell: bash
        run: |
          if [ -f "pubspec.lock" ]; then
            flutter pub get --enforce-lockfile
          else
            flutter pub get
          fi

      - name: Build ARM64 Release APK
        shell: bash
        timeout-minutes: 35
        run: |
          set -o pipefail

          mkdir -p build-logs

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --no-pub \
            --verbose \
            2>&1 | tee build-logs/flutter-build.log

      - name: Verify generated APK
        id: verify
        if: success()
        shell: bash
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK file was not generated."
            echo "APK files found:"
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

          echo "APK path: $APK_PATH"
          echo "APK size: $APK_SIZE"
          echo "SHA-256: $APK_SHA256"

          ls -lh "$APK_PATH"

      - name: Generate SHA-256 checksum
        if: success()
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-arm64-v8a-release.apk \
            > app-arm64-v8a-release.apk.sha256

          cat app-arm64-v8a-release.apk.sha256

      - name: Write build summary
        if: success()
        shell: bash
        run: |
          {
            echo "# Android APK 构建成功"
            echo ""
            echo "## 构建信息"
            echo ""
            echo "- Flutter：3.38.7 stable"
            echo "- Java：17"
            echo "- 类型：Release"
            echo "- 架构：ARM64 / arm64-v8a"
            echo "- APK 大小：${{ steps.verify.outputs.apk_size }}"
            echo "- SHA-256：\`${{ steps.verify.outputs.apk_sha256 }}\`"
            echo ""
            echo "## 产物"
            echo ""
            echo "- app-arm64-v8a-release.apk"
           
