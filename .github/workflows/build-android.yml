name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true

      - name: Show environment information
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Clean project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Display APK files
        if: success()
        run: |
          find build/app/outputs/flutter-apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hikari-novel-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hikari-novel-build-reports-${{ github.run_number }}
          path: |
            android/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
